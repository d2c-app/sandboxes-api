apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandboxes-api-role
  labels:
    app: sandboxes-api
rules:
# Permissions to manage SandboxClaim custom resources
- apiGroups:
  - "extensions.agents.x-k8s.io"
  resources:
  - sandboxclaims
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
# Permissions to read Sandbox objects (resolve pod name from annotation)
- apiGroups:
  - "agents.x-k8s.io"
  resources:
  - sandboxes
  verbs:
  - get
# Permissions to read Pods (resolve Pod IP for sandbox connectivity)
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
