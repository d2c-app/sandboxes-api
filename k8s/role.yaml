apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandboxes-api-role
  labels:
    app: sandboxes-api
rules:
# Permissions to manage SandboxClaim custom resources
- apiGroups:
  - "extensions.agents.x-k8s.io"
  resources:
  - sandboxclaims
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - delete
