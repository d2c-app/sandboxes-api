apiVersion: v1
kind: Service
metadata:
  name: sandboxes-api-service
  labels:
    app: sandboxes-api
    component: api
spec:
  type: ClusterIP  # Use LoadBalancer or NodePort for external access
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: sandboxes-api
    component: api
