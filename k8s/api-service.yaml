apiVersion: v1
kind: Service
metadata:
  name: sandboxes-api-service
  annotations:
    cloud.google.com/neg: '{"exposed_ports": {"80":{}}}'
  labels:
    app: sandboxes-api
    component: api
spec:
  type: NodePort  # Changed from ClusterIP for Ingress compatibility
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: sandboxes-api
    component: api
