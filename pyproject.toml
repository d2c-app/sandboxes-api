[project]
name = "sandboxes-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pasha Kononov", email = "pasha@promptlayer.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "pydantic-settings>=2.12.0",
    "redis>=7.1.0",
    "rq>=2.6.1",
    "kubernetes>=30.0.0",
    "sqlalchemy>=2.0.46",
    "psycopg[binary]>=3.3.2",
]

[project.scripts]
api = "sandboxes_api.main:main"
worker = "sandboxes_api.worker:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"
